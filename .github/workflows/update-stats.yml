name: Update README Stats
on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Create profile folder
        run: mkdir -p profile
      
      - name: Generate Top Langs Card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: 'username=Catelt&layout=compact&langs_count=10&theme=dark'
          path: 'profile/top-langs.svg'
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git checkout -B stats
          
          git add profile/top-langs.svg
          git commit -m "chore: update github stats" || echo "No changes to commit"
          
          git push origin stats --force